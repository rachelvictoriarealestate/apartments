name: Check new communities

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scrape/probe.mjs
      - name: Save results
        run: |
          git config user.name "apartment-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json debug-probe
          git diff --cached --quiet || (git commit -m "Community check $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
