name: Check live page

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to check"
        required: false
        default: "https://rachelvictoriarealestate.github.io/apartments/c/claudia/"
      send_test:
        description: "Also send one test pick (1 = yes)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scrape/check-page.mjs "${{ github.event.inputs.url }}"
        env:
          SEND_TEST: ${{ github.event.inputs.send_test }}
      - name: Save screenshots
        if: always()
        run: |
          git config user.name "apartment-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/check-page.json debug/check-*.png
          git diff --cached --quiet || (git commit -m "Page check $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
