name: Refresh apartments

on:
  schedule:
    - cron: "0 11 * * *"   # every day at 11:00 UTC (6 a.m. Central in summer, 5 a.m. in winter)
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Pushes only redeploy the page; the schedule and the button also re-read every community.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scrape/run.mjs
      - name: Save new data
        run: |
          git config user.name "apartment-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data debug
          git diff --cached --quiet || (git commit -m "Daily refresh $(date -u +%Y-%m-%d)" && git push)

  deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep only the website files
        run: mkdir _site && cp -r index.html data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
